          <!-- Easy = 톤 모드(EqMode.TONE). 다른 모드와 동일하게 base(원본/불러온 커스텀)→
               draft(임시 편집)→저장(커스텀) 구조를 따른다 — "얹기" 개념 노출 없음. -->
          <div id="easyPanel">

              <button onclick="saveTone()" style="flex:1;padding:8px;border-radius:10px;border:1px solid #303034;background:#1f1f22;color:#c9c9ce;font-size:12px;cursor:pointer;">저장하기</button>

            </div>
            <div id="toneList" style="display:none;margin-top:8px;background:#1f1f22;border:1px solid #303034;border-radius:10px;overflow:hidden;"></div>
          </div>

          <div id="proPanel" style="display:none;">
            <!-- 2단계: 그래픽 ↔ 파라메트릭 -->

              <button id="proGraphicBtn" onclick="setProMode('graphic')" style="flex:1;padding:7px;border:none;border-radius:8px;background:#d62839;color:#fff;font-size:12px;font-weight:600;cursor:pointer;">그래픽</button>
              <button id="proParametricBtn" onclick="setProMode('parametric')" style="flex:1;padding:7px;border:none;border-radius:8px;background:transparent;color:#c9c9ce;font-size:12px;font-weight:600;cursor:pointer;">파라메트릭</button>
            </div>

            <!-- 그래픽 = EqMode.GRAPHIC(고정 20밴드). Easy/파라메트릭과 동일한
                 base→draft→저장(커스텀) 구조 — "얹기" 개념 노출 없음. -->
            <div id="graphicPanel">
              <!-- 화면 폭 안에서 페이지 단위로 넘기는 구조(가로 스크롤 없음) — 방송/오디오
                   튜닝 장비의 세로 페이더를, 고정된 화면 폭에 맞춰 여러 페이지로 나눈 것. -->
              <div style="display:flex;align-items:center;gap:4px;">

              </div>

              <div style="display:flex;gap:8px;">
                <button onclick="resetGraphic()" style="flex:1;padding:8px;border-radius:10px;border:1px solid #303034;background:#1f1f22;color:#c9c9ce;font-size:12px;cursor:pointer;">초기화</button>
                <button onclick="saveGraphic()" style="flex:1;padding:8px;border-radius:10px;border:1px solid #303034;background:#1f1f22;color:#c9c9ce;font-size:12px;cursor:pointer;">저장하기</button>
                <button onclick="toggleGraphicList()" style="padding:8px 10px;border-radius:10px;border:1px solid #303034;background:#1f1f22;color:#c9c9ce;font-size:12px;cursor:pointer;">불러오기 ▾</button>
              </div>

            </div>

            <!-- 파라메트릭 = EqMode.PARAMETRIC. 이제 다른 두 모드와 동일한 base→draft→
                 저장(커스텀) 구조 하나만 쓴다 — 예전에 있던 얹기/직접수정 토글은 제거. -->

              <!-- 그래픽과 같은 이유로 페이지 단위로 넘긴다(밴드 개수가 가변이라 페이지 수도 매번 다시 계산됨) -->

                <span onclick="setParamPage(-1)" style="font-size:18px;color:#8a8a90;cursor:pointer;padding:8px 4px;user-select:none;">‹</span>
                <div id="paramBandStrip" ontouchstart="onParamTouchStart(event)" ontouchend="onParamTouchEnd(event)" style="display:flex;justify-content:space-around;flex:1;padding:6px 0;overflow:hidden;"></div>
                <span onclick="setParamPage(1)" style="font-size:18px;color:#8a8a90;cursor:pointer;padding:8px 4px;user-select:none;">›</span>
              </div>
              <div id="paramPageDots" style="display:flex;justify-content:center;gap:6px;margin:6px 0 10px;"></div>
              <div style="display:flex;gap:8px;">
                <button onclick="resetParam()" style="flex:1;padding:8px;border-radius:10px;border:1px solid #303034;background:#1f1f22;color:#c9c9ce;font-size:12px;cursor:pointer;">초기화</button>
                <button onclick="saveParam()" style="flex:1;padding:8px;border-radius:10px;border:1px solid #303034;background:#1f1f22;color:#c9c9ce;font-size:12px;cursor:pointer;">저장하기</button>
                <button onclick="toggleParamList()" style="padding:8px 10px;border-radius:10px;border:1px solid #303034;background:#1f1f22;color:#c9c9ce;font-size:12px;cursor:pointer;">불러오기 ▾</button>
              </div>
              <div id="paramList" style="display:none;margin-top:8px;background:#1f1f22;border:1px solid #303034;border-radius:10px;overflow:hidden;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let auralOn = false;
let selectedProfileName = null;
let cameFrom = 'home';

// ── 그래프 근사 유틸(목업 한정 — 실제 바이쿼드 연산이 아니라 모양만 근사) ──────
// 105Hz/300Hz/1kHz/4kHz/10kHz — Olive(2022) Figure 4의 Harman 타깃 형태를 딴,
// "이 헤드폰의 원본 보정" 근사 앵커.
const baseAnchors = [[105,2],[300,0],[1000,0],[4000,6],[10000,-2]];

function dbToY(db){ return Math.max(0, Math.min(120, 60 - db*6)); }
function catmullRomToBezier(pts){
  let d = 'M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i===0?i:i-1];
    const p1 = pts[i];
    const p2 = pts[i+1];
    const p3 = pts[i+2<pts.length?i+2:i+1];
    const c1x = p1[0]+(p2[0]-p0[0])/6;
    const c1y = p1[1]+(p2[1]-p0[1])/6;
    const c2x = p2[0]-(p3[0]-p1[0])/6;
    const c2y = p2[1]-(p3[1]-p1[1])/6;
    d += ' C '+c1x.toFixed(1)+' '+c1y.toFixed(1)+', '+c2x.toFixed(1)+' '+c2y.toFixed(1)+', '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function xForFreq(hz){
  const lo = Math.log10(20), hi = Math.log10(20000);
  return 10 + (330-10) * (Math.log10(hz)-lo)/(hi-lo);
}
function baseGainAt(hz){
  if(hz <= baseAnchors[0][0]) return baseAnchors[0][1];
  const last = baseAnchors[baseAnchors.length-1];
  if(hz >= last[0]) return last[1];
  for(let i=0;i<baseAnchors.length-1;i++){
    const [f0,g0] = baseAnchors[i], [f1,g1] = baseAnchors[i+1];
    if(hz>=f0 && hz<=f1){
      const t = (Math.log10(hz)-Math.log10(f0))/(Math.log10(f1)-Math.log10(f0));
      return g0 + (g1-g0)*t;
    }
  }
  return 0;
}
// 밴드 타입별 "그럴듯한 모양" 근사 — LS/HS는 시그모이드형 쉘프, PEAKING은
// Q가 커질수록 좁아지는 로그-주파수 종형 곡선.
function bandContributionAt(band, hz){
  const ratio = hz / band.freq;
  if(band.type === 'LS'){
    const s = Math.pow(ratio, 2*band.q);
    return band.gain / (1+s);
  }
  if(band.type === 'HS'){
    const s = Math.pow(ratio, 2*band.q);
    return band.gain * s / (1+s);
  }
  const oct = Math.log2(ratio);
  return band.gain * Math.exp(-(oct*oct) * (0.5 + band.q));
}
const GRAPH_FREQS = [20,31,50,80,125,200,315,500,800,1250,2000,3150,5000,8000,12500,20000];

// ── 공용 편집 모델(3개 모드 전부 동일) ───────────────────────────────────────
// base   = 이번 편집 세션이 시작된 지점(reset이 돌아갈 곳) — "진짜 원본"이거나
//          "불러온 커스텀의 마지막 저장값" 둘 중 하나.
// draft  = 지금 화면에서 만지고 있는 임시 편집 상태(메모리 — 실제 앱에서는
//          SharedPreferences/DataStore로 영속화되어 재부팅해도 복원된다).
// custom = "저장하기"를 눌러야 만들어지는, 이름 붙은 결과물. 목록에서 불러오면
//          그 커스텀이 새 base가 되어 계속 고칠 수 있다.
// isFromCustom = base가 "불러온 커스텀"인지 여부 — 초기화 시 질문이 1개(아니오)
//                또는 2개(예: 이 커스텀 값 vs 진짜 원본)가 되는 걸 가른다.
// editedIndex  = 지금 이어서 고치고 있는 커스텀의 인덱스(저장 시 새로 만들지
//                않고 덮어씀) — null이면 저장 시 새 항목을 만든다.

// ── ① Easy = EqMode.TONE — 고정 3밴드.
//    실제 AutoEqViewModel.toneSpecs(): LS 100Hz Q0.7(저음)·P 1kHz Q0.9(중음)·HS 10kHz Q0.7(고음). ──
const TONE_BANDS = [
  {label:'저음', type:'LS', freq:100, q:0.7},
  {label:'중음', type:'P', freq:1000, q:0.9},
  {label:'고음', type:'HS', freq:10000, q:0.7},
];
let toneGains = [0,0,0];
let toneBase = [0,0,0];
let toneIsFromCustom = false;
let toneEditedIndex = null;
let toneCustoms = [];

// ── ② Pro·그래픽 = EqMode.GRAPHIC — 고정 20밴드(로그 스케일).
//    실제 GraphicEqBands: f_i = 20*1000^(i/19), 전 밴드 공용 크로스오버 Q. ──
const GRAPHIC_COUNT = 20;
const GRAPHIC_FREQS = Array.from({length:GRAPHIC_COUNT}, (_,i)=> 20*Math.pow(1000, i/(GRAPHIC_COUNT-1)));
const GRAPHIC_Q = 1.0;
let graphicGains = new Array(GRAPHIC_COUNT).fill(0);
let graphicBase = new Array(GRAPHIC_COUNT).fill(0);
let graphicIsFromCustom = false;
let graphicEditedIndex = null;
let graphicCustoms = [];

// ── ③ Pro·파라메트릭 = EqMode.PARAMETRIC — 자유 배치 밴드(최대 10개, AutoEqProfile.MAX_FILTERS). ──
const PARAM_MAX_BANDS = 10;

// "진짜 원본" — 지금 활성 헤드폰의 실제 보정 밴드 스냅샷(예시 데이터). 이미
// 다운로드돼 있는 실제 보정값(0dB 평탄이 아님) — baseAnchors([105,2],[300,0],
// [1000,0],[4000,6],[10000,-2])와 같은 모양. 편집은 이 값을 그대로 불러와서
// 시작해야 한다 — "원본을 고치는 것"인데 평탄한 무보정에서 출발하면 말이 안 된다.
// 초기화의 "진짜 원본으로" 선택지가 항상 돌아갈 수 있는 불변의 기준점이기도 하다.
const ORIGINAL_PROFILE_BANDS = [
  {type:'LS', freq:105, q:0.7, gain:2},
  {type:'P', freq:300, q:1.0, gain:0},
  {type:'P', freq:1000, q:1.2, gain:0},
  {type:'P', freq:4000, q:1.0, gain:6},
  {type:'HS', freq:10000, q:0.7, gain:-2},
];
let paramBase = null;   // 이번 편집 세션의 시작점(base) — reset이 돌아갈 지점
let paramDraft = null;  // 작업 중인 편집본(복사본)
let paramIsFromCustom = false;
let paramEditedIndex = null;
let paramCustoms = [];  // 저장된 커스텀 프로파일 목록

let uiMode = 'easy';     // 'easy' | 'pro'
let proMode = 'graphic'; // 'graphic' | 'parametric'

function formatFreq(hz){
  return hz >= 1000 ? (hz/1000).toFixed(1)+'kHz' : hz.toFixed(0)+'Hz';
}

// ── 그래프: Easy/그래픽은 고정 그리드 게인을 원본 위에 수치로 더해 근사하고,
//    파라메트릭은 밴드 자체가 곧 편집본이라 base/draft를 각각 그대로 합성한다.
//    (결과 커브는 두 방식이 수학적으로 동일 — "얹기"였던 시절과 그림은 안 바뀐다.) ──
function currentOverlayContribAt(hz){
  if(uiMode === 'easy'){
    return TONE_BANDS.reduce((s,spec,i)=> s + bandContributionAt({type:spec.type, freq:spec.freq, q:spec.q, gain:toneGains[i]}, hz), 0);
  }
  if(uiMode === 'pro' && proMode === 'graphic'){
    let s = 0;
    for(let i=0;i<GRAPHIC_COUNT;i++) s += bandContributionAt({type:'P', freq:GRAPHIC_FREQS[i], q:GRAPHIC_Q, gain:graphicGains[i]}, hz);
    return s;
  }
  return 0; // 파라메트릭은 아래 redrawGraphs()에서 base/draft로 직접 계산한다.
}
function redrawGraphs(){
  let autoPts, tunedPts;
  if(uiMode === 'pro' && proMode === 'parametric' && paramDraft){
    // 편집본(실선)=지금 밴드 자체의 합성, 원본(점선)=이번 편집이 시작된 스냅샷(base)의 합성.
    autoPts = GRAPH_FREQS.map(f => [xForFreq(f), dbToY(paramBase.reduce((s,b)=>s+bandContributionAt(b,f),0))]);
    tunedPts = GRAPH_FREQS.map(f => [xForFreq(f), dbToY(paramDraft.reduce((s,b)=>s+bandContributionAt(b,f),0))]);
  } else {
    // Easy/그래픽: 원본(점선)=이 헤드폰의 실제 보정, 편집본(실선)=원본+지금 조정값.
    autoPts = GRAPH_FREQS.map(f => [xForFreq(f), dbToY(baseGainAt(f))]);
    tunedPts = GRAPH_FREQS.map(f => [xForFreq(f), dbToY(baseGainAt(f) + currentOverlayContribAt(f))]);
  }
  document.getElementById('autoCurve').setAttribute('d', catmullRomToBezier(autoPts));
  document.getElementById('tunedCurve').setAttribute('d', catmullRomToBezier(tunedPts));
}

function updateBadge(){
  const badge = document.getElementById('auralBadge');
  const text = document.getElementById('badgeText');
  const icon = document.getElementById('badgeIcon');
  if(auralOn && selectedProfileName){
    badge.style.background = 'rgba(214,40,57,0.92)';
    badge.style.borderColor = 'rgba(214,40,57,0.92)';
    text.textContent = 'auraltune - ' + selectedProfileName;
    text.style.color = '#fff';
    icon.style.color = '#fff';
  } else {
    badge.style.background = 'rgba(40,40,44,0.55)';
    badge.style.borderColor = 'rgba(255,255,255,0.28)';
    text.textContent = 'AuralTune';
    text.style.color = '#c9c9ce';
    icon.style.color = '#c9c9ce';
  }
}

function updateQsTile(){
  const label = document.getElementById('qsLabel');
  const icon = document.getElementById('qsIcon');
  const tileIcon = document.getElementById('qsTileIcon');
  if(auralOn && selectedProfileName){
    label.textContent = 'AuralTune 켜짐 · ' + selectedProfileName;
    icon.style.color = '#fff';
    tileIcon.style.background = '#d62839';
  } else {
    label.textContent = 'AuralTune 꺼짐';
    icon.style.color = '#8a8a90';
    tileIcon.style.background = '#2a2a2e';
  }
}

// 1단계(선택 후 바로 청취) ↔ 2단계(튜닝) — 프로파일 선택과는 별개의 상태.
// 튜닝 버튼을 눌러야만 검색창이 사라지고 그래프가 위로 올라오며 Easy/Pro가 나타난다.
let editMode = false;

function toggleEditMode(){
  editMode = !editMode;
  applyEditModeVisibility();
}
function applyEditModeVisibility(){
  const hasProfile = !!selectedProfileName;
  document.getElementById('searchArea').style.display = editMode ? 'none' : 'block';
  document.getElementById('tuneArea').style.display = (editMode && hasProfile) ? 'block' : 'none';
  document.getElementById('tuningToggleBtn').textContent = editMode ? '닫기' : '튜닝';
  if(editMode && hasProfile){
    renderAll(); // Easy/Pro 위젯을 다시 그리고, 그 끝에서 그래프도 함께 갱신한다.
  } else if(hasProfile){
    // 그래프는 튜닝 화면을 닫아도(1단계에서도) 항상 보이므로, 프로파일을 새로
    // 고르거나 닫기를 눌렀을 때도 매번 다시 그려야 한다 — 안 그러면 방금 닫은
    // 파라메트릭 편집 곡선이 새 프로파일을 골라도 화면에 그대로 남는다.
    redrawGraphs();
  }
}

function updateSettingsView(){
  const hasProfile = !!selectedProfileName;
  document.getElementById('autoCurve').style.display = hasProfile ? 'block' : 'none';
  document.getElementById('tunedCurve').style.display = hasProfile ? 'block' : 'none';
  document.getElementById('emptyGraphHint').style.display = hasProfile ? 'none' : 'block';
  document.getElementById('graphLegend').style.display = hasProfile ? 'block' : 'none';
  document.getElementById('tuningToggleBtn').style.display = hasProfile ? 'inline-block' : 'none';
  document.getElementById('searchText').textContent = hasProfile ? selectedProfileName : '헤드폰 또는 프로파일 검색';
  document.getElementById('searchText').style.color = hasProfile ? '#e8e8ea' : '#8a8a90';
  applyEditModeVisibility();
}

function showScreen(name){
  document.getElementById('screenHome').style.display = name==='home' ? 'block' : 'none';
  document.getElementById('screenSettings').style.display = name==='settings' ? 'block' : 'none';
}

function openSettings(from){
  cameFrom = from;
  document.getElementById('searchList').style.display = 'none';
  editMode = false; // 설정에 들어올 때는 항상 1단계(선택 후 바로 청취)부터.
  showScreen('settings');
  updateSettingsView();
}

function goBackFromSettings(){
  showScreen(cameFrom);
}

function toggleSearchList(){
  const list = document.getElementById('searchList');
  list.style.display = list.style.display === 'block' ? 'none' : 'block';
}

function selectProfile(name){
  document.getElementById('searchList').style.display = 'none';
  if(name === null){
    auralOn = false;
    selectedProfileName = null;
  } else {
    selectedProfileName = name;
    auralOn = true;
  }
  // 선택은 항상 "1단계: 선택 후 바로 청취"로 떨어진다 — 튜닝은 매번 다시 눌러서 들어간다.
  editMode = false;
  // 검색창에서 프로파일을 다시 읽어 들이는 것 = 3개 모드 전부 새 편집 세션을 시작하는 것.
  // 진짜 원본(DB)에서부터 다시 시작 — "진짜 원본이 필요하면 검색창에서 다시 불러오라"는
  // 사용자 확정 흐름. 이전 헤드폰에서 쓰던 튜닝값은 여기 남아있지 않다 — 그 값은 이전
  // 헤드폰의 보정 곡선을 전제로 맞춘 것이라, 새 헤드폰의 다른 보정 곡선 위에 그대로
  // 얹히면 의도치 않은 소리(예: 이미 저음이 충분한 헤드폰에 저음 부스트가 또 얹힘)가
  // 될 수 있다 — 조용히 넘어오는 것보다 원점에서 다시 튜닝하는 편이 안전하다.
  // (반대로 "불러오기"로 저장된 커스텀을 여는 경우는 이 리셋 대상이 아니다 —
  // loadToneCustom/loadGraphicCustom/loadParamCustom이 그 커스텀 자체를 새 base로
  // 설정한다. 거긴 "이전 헤드폰 값이 새 헤드폰에 몰래 남는" 상황이 아니라, 사용자가
  // 이름 붙여 저장해둔 특정 조합을 의도적으로 다시 불러오는 것이기 때문.)
  toneGains = [0,0,0]; toneBase = [0,0,0]; toneIsFromCustom = false; toneEditedIndex = null;
  graphicGains = new Array(GRAPHIC_COUNT).fill(0); graphicBase = graphicGains.slice();
  graphicIsFromCustom = false; graphicEditedIndex = null;
  paramBase = null; paramDraft = null; paramIsFromCustom = false; paramEditedIndex = null;
  updateSettingsView();
  updateBadge();
  updateQsTile();
}

// ── 1단계: Easy ↔ Pro ────────────────────────────────────────────────────
function setUiMode(mode){ uiMode = mode; renderAll(); }
// ── 2단계(Pro 안): 그래픽 ↔ 파라메트릭 ──────────────────────────────────
function setProMode(mode){
  proMode = mode;
  // 파라메트릭에 처음 들어오는 순간(이번 프로파일 선택 이후 아직 편집을 시작 안 했다면)
  // 진짜 원본에서 편집 세션을 새로 튼다 — 예전엔 "직접 수정" 토글을 눌러야만 이 시점이었지만,
  // 이제 파라메트릭은 항상 이 흐름 하나뿐이다.
  if(mode === 'parametric' && !paramDraft) startParamFromOriginal();
  renderAll();
}
// 그래픽과 같은 이유(가로/과도한 스크롤 지양)로 파라메트릭 밴드도 페이지 단위로 넘긴다.
// 밴드 개수가 가변이라 그래픽과 달리 페이지 수를 매번 다시 계산한다.
const PARAM_PAGE_SIZE = 3;
let paramPage = 0;
// "+ 밴드 추가" 타일도 페이지 그리드의 슬롯 하나를 차지하는 항목으로 계산해야 한다.
// 안 그러면 밴드 수가 PAGE_SIZE의 배수가 될 때마다 마지막 페이지가 실밴드로 꽉 차서
// 추가 타일이 4번째 항목으로 넘쳐 overflow:hidden 밖으로 잘려 사라진다(=더 못 추가).
function paramTotalSlots(){
  const bands = activeParamBands();
  return bands.length + (bands.length < paramMax() ? 1 : 0);
}
function paramPageCount(){
  return Math.max(1, Math.ceil(paramTotalSlots() / PARAM_PAGE_SIZE));
}
function setParamPage(delta){ goToParamPage(paramPage + delta); }
function goToParamPage(page){
  paramPage = clamp(page, 0, paramPageCount() - 1);
  renderParametric();
}
let paramTouchStartX = null;
function onParamTouchStart(e){ paramTouchStartX = e.touches[0].clientX; }
function onParamTouchEnd(e){
  if(paramTouchStartX === null) return;
  const dx = e.changedTouches[0].clientX - paramTouchStartX;
  if(dx > 40) setParamPage(-1);
  else if(dx < -40) setParamPage(1);
  paramTouchStartX = null;
}
function startParamFromOriginal(){
  // 이 편집 세션의 시작점(base) = 지금 활성 프로파일의 실제 보정 밴드 스냅샷(진짜 원본).
  paramBase = JSON.parse(JSON.stringify(ORIGINAL_PROFILE_BANDS));
  paramDraft = JSON.parse(JSON.stringify(ORIGINAL_PROFILE_BANDS));
  paramIsFromCustom = false;
  paramEditedIndex = null;
}

// ── 공용 초기화 흐름 — "버려도 되는지" + (불러온 커스텀에서 시작했다면) "어디로"
//    두 가지를 확인한다. isFromCustom=false면 되돌아갈 곳이 원본 하나뿐이라 질문 1개.
//    반환값: 'cancel' | 'base'(지금 이 세션의 base로) | 'original'(진짜 원본으로).
function confirmResetTarget(isFromCustom){
  if(!confirm('편집한 내용을 버리고 초기화할까요?')) return 'cancel';
  if(!isFromCustom) return 'original';
  return confirm('불러온 커스텀의 저장값으로 되돌릴까요?\n(취소를 누르면 이 헤드폰의 원본 보정으로 되돌립니다)')
    ? 'base' : 'original';
}

function renderAll(){
  setBtnActive('modeEasyBtn', uiMode==='easy');
  setBtnActive('modeProBtn', uiMode==='pro');
  document.getElementById('easyPanel').style.display = uiMode==='easy' ? 'block' : 'none';
  document.getElementById('proPanel').style.display = uiMode==='pro' ? 'block' : 'none';

  if(uiMode === 'pro'){
    setBtnActive('proGraphicBtn', proMode==='graphic');
    setBtnActive('proParametricBtn', proMode==='parametric');
    document.getElementById('graphicPanel').style.display = proMode==='graphic' ? 'block' : 'none';
    document.getElementById('parametricPanel').style.display = proMode==='parametric' ? 'block' : 'none';
  }

  if(uiMode==='easy') renderTone();
  if(uiMode==='pro' && proMode==='graphic') renderGraphic();
  if(uiMode==='pro' && proMode==='parametric') renderParametric();
  redrawGraphs();
}
function setBtnActive(id, active){
  const el = document.getElementById(id);
  el.style.background = active ? '#d62839' : 'transparent';
  el.style.color = active ? '#fff' : '#c9c9ce';
}

// ── ① Easy(톤) ────────────────────────────────────────────────────────────
function renderTone(){
  document.getElementById('toneRows').innerHTML = TONE_BANDS.map((spec,i) => (
    '<div style="margin-bottom:14px;">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">'
    + '<span style="font-size:12px;color:#e8e8ea;font-weight:600;">'+spec.label+' <span style="font-size:10px;color:#8a8a90;font-weight:400;">'+formatFreq(spec.freq)+' · Q '+spec.q.toFixed(1)+'</span></span>'
    + '<span id="toneVal'+i+'" style="font-size:12px;color:#d62839;font-weight:600;">'+(toneGains[i]>0?'+':'')+toneGains[i]+'dB</span>'
    + '</div>'
    + '<input type="range" min="-12" max="12" value="'+toneGains[i]+'" step="1" oninput="onToneChange('+i+', this.value)" style="width:100%;" />'
    + '</div>'
  )).join('');
}
function onToneChange(i, val){
  toneGains[i] = parseFloat(val);
  const v = document.getElementById('toneVal'+i);
  if(v) v.textContent = (toneGains[i]>0?'+':'')+toneGains[i]+'dB';
  redrawGraphs();
}
function resetTone(){
  const target = confirmResetTarget(toneIsFromCustom);
  if(target === 'cancel') return;
  if(target === 'original'){
    toneGains = [0,0,0];
    toneBase = [0,0,0];
    toneIsFromCustom = false;
    toneEditedIndex = null;
  } else {
    toneGains = toneBase.slice();
  }
  renderTone(); redrawGraphs();
}
function saveTone(){
  if(toneEditedIndex !== null){
    // 이어서 고치던 커스텀 — 덮어쓴다(이름은 그대로).
    toneCustoms[toneEditedIndex].gains = toneGains.slice();
  } else {
    const name = prompt('저장할 이름을 입력하세요', (selectedProfileName||'내') + ' 커스텀 ' + (toneCustoms.length+1));
    if(!name) return;
    toneCustoms.push({name, gains: toneGains.slice()});
    toneEditedIndex = toneCustoms.length - 1;
  }
  // 저장한 지점이 이제부터 이 세션의 base — 초기화하면 여기로(또는 진짜 원본으로) 돌아간다.
  toneBase = toneGains.slice();
  toneIsFromCustom = true;
}
function loadToneCustom(i){
  toneGains = toneCustoms[i].gains.slice();
  toneBase = toneGains.slice();
  toneIsFromCustom = true;
  toneEditedIndex = i;
  renderTone(); redrawGraphs();
  document.getElementById('toneList').style.display = 'none';
}
function toggleToneList(){
  const list = document.getElementById('toneList');
  if(list.style.display !== 'block') renderPresetList('toneList', toneCustoms, 'loadToneCustom');
  else list.style.display = 'none';
}

// ── ② Pro·그래픽 ──────────────────────────────────────────────────────────
// 방송/오디오 튜닝 장비의 "세로 페이더 여러 개를 나란히" 관례는 유지하되, 화면이
// 고정된 모바일에서는 20개를 가로로 계속 스크롤시키지 않고 5개씩 페이지로 나눠
// 넘긴다(ViewPager 개념 — 좌우 화살표 클릭 또는 스와이프).
const GRAPHIC_PAGE_SIZE = 5;
const GRAPHIC_PAGE_COUNT = Math.ceil(GRAPHIC_COUNT / GRAPHIC_PAGE_SIZE);
let graphicPage = 0;

function setGraphicPage(delta){
  goToGraphicPage(graphicPage + delta);
}
function goToGraphicPage(page){
  graphicPage = clamp(page, 0, GRAPHIC_PAGE_COUNT - 1);
  renderGraphic();
}
let graphicTouchStartX = null;
function onGraphicTouchStart(e){ graphicTouchStartX = e.touches[0].clientX; }
function onGraphicTouchEnd(e){
  if(graphicTouchStartX === null) return;
  const dx = e.changedTouches[0].clientX - graphicTouchStartX;
  if(dx > 40) setGraphicPage(-1);
  else if(dx < -40) setGraphicPage(1);
  graphicTouchStartX = null;
}
function renderGraphic(){
  const start = graphicPage * GRAPHIC_PAGE_SIZE;
  const end = Math.min(start + GRAPHIC_PAGE_SIZE, GRAPHIC_COUNT);
  let html = '';
  for(let i=start;i<end;i++){
    const g = graphicGains[i];
    html += '<div style="display:flex;flex-direction:column;align-items:center;width:56px;">'
      + '<span style="font-size:10px;color:#d62839;height:14px;">'+(g!==0?((g>0?'+':'')+g):'')+'</span>'
      + '<input type="range" min="-12" max="12" value="'+g+'" step="1" oninput="onGraphicChange('+i+', this.value)" style="width:130px;height:24px;transform:rotate(-90deg);margin:52px 0;" />'
      + '<span style="font-size:10px;color:#5a5a60;margin-top:6px;white-space:nowrap;">'+graphicLabel(GRAPHIC_FREQS[i])+'</span>'
      + '</div>';
  }
  document.getElementById('graphicFaders').innerHTML = html;
  document.getElementById('graphicPageDots').innerHTML = Array.from({length:GRAPHIC_PAGE_COUNT}, (_,p) => (
    '<span onclick="goToGraphicPage('+p+')" style="width:6px;height:6px;border-radius:50%;cursor:pointer;background:'+(p===graphicPage?'#d62839':'#3a3a3f')+';"></span>'
  )).join('');
}
function graphicLabel(hz){
  if(hz>=1000) return (hz/1000>=10 ? (hz/1000).toFixed(0) : (hz/1000).toFixed(1))+'k';
  return hz.toFixed(0);
}
function onGraphicChange(i, val){
  graphicGains[i] = parseFloat(val);
  redrawGraphs();
  const localIdx = i - graphicPage * GRAPHIC_PAGE_SIZE;
  const row = document.getElementById('graphicFaders').children[localIdx];
  if(row) row.firstElementChild.textContent = graphicGains[i]!==0 ? ((graphicGains[i]>0?'+':'')+graphicGains[i]) : '';
}
function resetGraphic(){
  const target = confirmResetTarget(graphicIsFromCustom);
  if(target === 'cancel') return;
  if(target === 'original'){
    graphicGains = new Array(GRAPHIC_COUNT).fill(0);
    graphicBase = graphicGains.slice();
    graphicIsFromCustom = false;
    graphicEditedIndex = null;
  } else {
    graphicGains = graphicBase.slice();
  }
  renderGraphic(); redrawGraphs();
}
function saveGraphic(){
  if(graphicEditedIndex !== null){
    graphicCustoms[graphicEditedIndex].gains = graphicGains.slice();
  } else {
    const name = prompt('저장할 이름을 입력하세요', (selectedProfileName||'내') + ' 커스텀 ' + (graphicCustoms.length+1));
    if(!name) return;
    graphicCustoms.push({name, gains: graphicGains.slice()});
    graphicEditedIndex = graphicCustoms.length - 1;
  }
  graphicBase = graphicGains.slice();
  graphicIsFromCustom = true;
}
function loadGraphicCustom(i){
  graphicGains = graphicCustoms[i].gains.slice();
  graphicBase = graphicGains.slice();
  graphicIsFromCustom = true;
  graphicEditedIndex = i;
  renderGraphic(); redrawGraphs();
  document.getElementById('graphicList').style.display = 'none';
}
function toggleGraphicList(){
  const list = document.getElementById('graphicList');
  if(list.style.display !== 'block') renderPresetList('graphicList', graphicCustoms, 'loadGraphicCustom');
  else list.style.display = 'none';
}

// ── ③ Pro·파라메트릭 — 다른 두 모드와 동일한 base→draft→저장(커스텀) 구조 하나만 쓴다. ──
function activeParamBands(){ return paramDraft; }
function paramMax(){ return PARAM_MAX_BANDS; }

function renderParametric(){
  const bands = activeParamBands();
  const max = paramMax();
  const totalSlots = paramTotalSlots(); // 실밴드 + (자리가 있으면) "+추가" 타일까지 포함한 슬롯 수.
  paramPage = clamp(paramPage, 0, paramPageCount() - 1);
  const start = paramPage * PARAM_PAGE_SIZE;
  const end = Math.min(start + PARAM_PAGE_SIZE, totalSlots);
  // 실제 커스텀 BandStrip과 동일한 세로 카드 — 게인은 그래픽 EQ와 같은 회전
  // 슬라이더(방송/오디오 장비의 세로 페이더 관례), 그 아래 주파수·Q는 +/- 스테퍼.
  // "+추가" 타일도 슬롯 하나(index === bands.length)로 취급해 페이지 안에서만 그린다 —
  // 그래야 페이지가 실밴드 3개로 꽉 찼을 때 타일이 4번째 항목으로 넘쳐 잘리지 않는다.
  let html = '';
  for(let i=start;i<end;i++){
    if(i < bands.length){
      const b = bands[i];
      html += '<div style="display:flex;flex-direction:column;align-items:center;width:100px;flex-shrink:0;">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:4px;">'
        + '<span onclick="cycleParamType('+i+')" style="font-size:11px;color:#c9c9ce;cursor:pointer;text-decoration:underline dotted;">'+b.type+'</span>'
        + '<span onclick="removeParamBand('+i+')" style="font-size:12px;color:#8a8a90;cursor:pointer;padding:0 2px;">✕</span>'
        + '</div>'
        + stepperHtml('paramGain'+i, (b.gain>0?'+':'')+b.gain.toFixed(1)+'dB', 'stepParamGain('+i+',-1)', 'stepParamGain('+i+',1)', 88)
        + '<input type="range" min="-12" max="12" value="'+b.gain+'" step="0.1" oninput="onParamGainChange('+i+', this.value)" style="width:90px;height:20px;transform:rotate(-90deg);margin:34px 0;" />'
        + stepperHtml('paramFreq'+i, formatFreq(b.freq), 'stepParamFreq('+i+',false)', 'stepParamFreq('+i+',true)', 88)
        + '<div style="height:4px;"></div>'
        + stepperHtml('paramQ'+i, 'Q '+b.q.toFixed(2), 'stepParamQ('+i+',-1)', 'stepParamQ('+i+',1)', 88)
        + '</div>';
    } else {
      html += '<div onclick="addParamBand()" style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100px;flex-shrink:0;color:#8a8a90;font-size:11px;cursor:pointer;">'
        + '<span style="font-size:20px;line-height:1;margin-bottom:6px;">+</span>밴드 추가<br>('+bands.length+'/'+max+')</div>';
    }
  }
  document.getElementById('paramBandStrip').innerHTML = html;
  document.getElementById('paramPageDots').innerHTML = Array.from({length:paramPageCount()}, (_,p) => (
    '<span onclick="goToParamPage('+p+')" style="width:6px;height:6px;border-radius:50%;cursor:pointer;background:'+(p===paramPage?'#d62839':'#3a3a3f')+';"></span>'
  )).join('');
}
// 미니 +/- 스테퍼(주파수/Q/게인 공용) — 실제 커스텀 화면의 MiniStepper(ValueStepper)와 같은 역할.
function stepperHtml(valId, valueText, decFn, incFn, width){
  return '<span style="display:inline-flex;align-items:center;background:#1f1f22;border-radius:8px;width:'+width+'px;flex-shrink:0;">'
    + '<span onclick="'+decFn+'" style="width:16px;text-align:center;color:#8a8a90;cursor:pointer;font-size:11px;">−</span>'
    + '<span id="'+valId+'" style="flex:1;text-align:center;font-size:10px;color:#e8e8ea;">'+valueText+'</span>'
    + '<span onclick="'+incFn+'" style="width:16px;text-align:center;color:#8a8a90;cursor:pointer;font-size:11px;">+</span>'
    + '</span>';
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
// 드래그(슬라이더)는 값 텍스트만 갱신 — 버튼 클릭(주파수/Q/타입/추가/삭제)은 구조가 안 바뀌므로
// 전체 재렌더링해도 안전하다(포인터 캡처를 잃을 드래그 대상이 없음).
function onParamGainChange(i, val){
  activeParamBands()[i].gain = parseFloat(val);
  const g = activeParamBands()[i].gain;
  const v = document.getElementById('paramGain'+i);
  if(v) v.textContent = (g>0?'+':'')+g.toFixed(1)+'dB';
  redrawGraphs();
}
function stepParamGain(i, dir){
  const b = activeParamBands()[i];
  b.gain = clamp(Math.round((b.gain + dir*0.1)*10)/10, -12, 12);
  renderParametric(); redrawGraphs();
}
const FREQ_LOG_STEP = Math.pow(2, 1/6); // 6스텝/옥타브 — 실제 커스텀 화면과 동일한 배율.
function stepParamFreq(i, up){
  const b = activeParamBands()[i];
  b.freq = clamp(up ? b.freq*FREQ_LOG_STEP : b.freq/FREQ_LOG_STEP, 20, 20000);
  renderParametric(); redrawGraphs();
}
function stepParamQ(i, dir){
  const b = activeParamBands()[i];
  b.q = clamp(Math.round((b.q + dir*0.05)*100)/100, 0.1, 10);
  renderParametric(); redrawGraphs();
}
function cycleParamType(i){
  const order = ['P','LS','HS'];
  const b = activeParamBands()[i];
  b.type = order[(order.indexOf(b.type)+1) % order.length];
  renderParametric(); redrawGraphs();
}
function addParamBand(){
  if(activeParamBands().length >= paramMax()) return;
  activeParamBands().push({type:'P', freq:1000, q:1.0, gain:0});
  const newIndex = activeParamBands().length - 1;
  paramPage = Math.floor(newIndex / PARAM_PAGE_SIZE); // 방금 추가한 밴드가 있는 페이지로.
  renderParametric(); redrawGraphs();
}
function removeParamBand(i){
  activeParamBands().splice(i,1);
  renderParametric(); redrawGraphs();
}
function resetParam(){
  // base는 "진짜 순정 원본"일 수도, "불러온 내 커스텀의 마지막 저장값"일 수도 있다 —
  // 커스텀을 불러온 뒤에는 그 커스텀이 이 세션의 base 역할을 한다. 두 경우를 구분해
  // 물어보고("이 커스텀 값으로" vs "진짜 원본으로"), 정한 대로 draft를 되돌린다.
  const target = confirmResetTarget(paramIsFromCustom);
  if(target === 'cancel') return;
  if(target === 'original'){
    paramBase = JSON.parse(JSON.stringify(ORIGINAL_PROFILE_BANDS));
    paramDraft = JSON.parse(JSON.stringify(ORIGINAL_PROFILE_BANDS));
    paramIsFromCustom = false;
    paramEditedIndex = null;
  } else {
    paramDraft = JSON.parse(JSON.stringify(paramBase));
  }
  paramPage = 0;
  renderParametric(); redrawGraphs();
}
function saveParam(){
  if(!selectedProfileName) return;
  if(paramEditedIndex !== null){
    // 이어서 고치던 커스텀 — 덮어쓴다(이름은 그대로).
    paramCustoms[paramEditedIndex].bands = JSON.parse(JSON.stringify(paramDraft));
  } else {
    const name = prompt('저장할 이름을 입력하세요', selectedProfileName + ' 커스텀 ' + (paramCustoms.length+1));
    if(!name) return;
    paramCustoms.push({name, bands: JSON.parse(JSON.stringify(paramDraft))});
    paramEditedIndex = paramCustoms.length - 1;
  }
  // 저장한 지점이 이제부터 이 세션의 base — 초기화하면 여기로(또는 진짜 원본으로) 돌아간다.
  paramBase = JSON.parse(JSON.stringify(paramDraft));
  paramIsFromCustom = true;
}
function loadParamCustom(i){
  // 저장된 커스텀을 다시 열어 고치는 경우 — base(리셋 기준)="이 커스텀의 마지막 저장 상태".
  paramBase = JSON.parse(JSON.stringify(paramCustoms[i].bands));
  paramDraft = JSON.parse(JSON.stringify(paramCustoms[i].bands));
  paramIsFromCustom = true;
  paramEditedIndex = i;
  paramPage = 0;
  renderParametric(); redrawGraphs();
  document.getElementById('paramList').style.display = 'none';
}
function toggleParamList(){
  const list = document.getElementById('paramList');
  if(list.style.display !== 'block') renderPresetList('paramList', paramCustoms, 'loadParamCustom');
  else list.style.display = 'none';
}

// ── 공용 프리셋 목록 렌더 ───────────────────────────────────────────────
function renderPresetList(listId, items, loaderFn){
  const list = document.getElementById(listId);
  list.style.display = 'block';
  list.innerHTML = items.length === 0
    ? '<div style="padding:10px 14px;font-size:12px;color:#8a8a90;">저장된 항목 없음</div>'
    : items.map(function(it,i){
        return '<div onclick="'+loaderFn+'('+i+')" style="padding:10px 14px;font-size:12px;color:#e8e8ea;cursor:pointer;border-bottom:1px solid #2a2a2e;">'+it.name+'</div>';
      }).join('');
}

let qsPressTimer = null;
let qsLongPressed = false;
function qsPointerDown(){
  qsLongPressed = false;
  qsPressTimer = setTimeout(function(){ qsLongPressed = true; openSettings('home'); }, 550);
}
function qsPointerUp(){
  clearTimeout(qsPressTimer);
  if(!qsLongPressed){
    if(selectedProfileName){
      auralOn = !auralOn;
      updateBadge();
      updateQsTile();
    } else {
      openSettings('home');
    }
  }
}

redrawGraphs();
updateBadge();
updateQsTile();
updateSettingsView();
</script>
